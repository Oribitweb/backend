# docker-compose.limits.yaml
services:
  app:
    extends:
      file: docker-compose.yaml
      service: backend
    container_name: app
    profiles: ["prod-sim"]
    build:
      context: .
      dockerfile: Dockerfile.stage
    volumes: !reset []
    command: bash start-all.sh
    environment:
      X264_PRESET: ultrafast
    cpuset: "0-1"
    memswap_limit: "${APP_MEM:-2G}"
    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS:-2}"
          memory: "${APP_MEM:-2G}"
          pids: 512
        reservations:
          cpus: "0.5"
          memory: 512M

  db:
    cpuset: "2"
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }

  redis:
    cpuset: "3"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  locust:
    cpuset: "4-5"