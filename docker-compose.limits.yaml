services:
  app:
    # Reuse env vars / depends_on from the existing `backend` service
    extends:
      file: docker-compose.yaml
      service: backend
    container_name: app
    profiles: ["prod-sim"]          # only starts when explicitly requested
    build:
      context: .
      dockerfile: Dockerfile.stage        # <- the Dockerfile production uses (NOT Dockerfile.dev)
    volumes: !reset []              # code is baked into the production image
    command: bash start-all.sh      # adjust the path to match your image's WORKDIR
    environment:
      - X264_PRESET=ultrafast
    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS:-4}"    # generous by default so limits don't cap the measurement
          memory: "${APP_MEM:-4G}"
        reservations:
          cpus: "0.5"
          memory: 512M
    memswap_limit: "${APP_MEM:-4G}" # same as memory = swap disabled